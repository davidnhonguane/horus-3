<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horus · Forest Risk Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 16c5-7 10-9 14-9s9 2 14 9c-5 7-10 9-14 9S7 23 2 16z' fill='%23e9a23b'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230b1210'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 28" class="eye" aria-hidden="true">
        <path d="M2 14C10 4 18 2 24 2s14 2 22 12C38 24 30 26 24 26S10 24 2 14z" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <circle cx="24" cy="14" r="6.5" fill="currentColor"/><circle cx="26" cy="12" r="2" fill="#0b1210"/>
      </svg>
      <div><b>HORUS <small id="ver"></small></b><span>forest risk &amp; emergency intelligence</span></div>
    </div>
    <div class="site-name" id="siteName">loading…</div>
    <button class="badge newbadge hidden" id="newBadge" title="Roads and power lines found in the scan that are not in any map data - click to see them"></button>
    <div class="spacer"></div>
    <button class="btn upbtn" id="upTop" title="Upload a 3D scan of a forest: .las .laz .ply .obj .glb .xyz .e57">⇪ Upload 3D scan</button>
    <label class="ctl">Conditions
      <select id="scenario">
        <option value="normal">Typical summer day</option>
        <option value="heatwave">Drought / heatwave</option>
        <option value="storm">Autumn storm</option>
        <option value="live">Live weather (Open-Meteo)</option>
      </select>
    </label>
    <div class="badge" id="fwiBadge" title="Canadian Fire Weather Index">FWI –</div>
    <div class="badge" id="gustBadge" title="Max gust used by the storm model">Gust –</div>
    <label class="ctl">Basemap
      <select id="basemap"><option value="none">None (offline)</option><option value="osm">OpenStreetMap</option><option value="satellite">Satellite (Esri)</option><option value="s2cloudless">Sentinel-2 cloudless</option><option value="nls_orto">NLS orthophoto (key)</option><option value="nls_maasto">NLS topographic (key)</option></select>
    </label>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="upload" class="upl"><i>⇪</i>Upload scan</button>
    <button data-tab="overview" class="on"><i>◎</i>Overview</button>
    <button data-tab="fire"><i>▲</i>Wildfire</button>
    <button data-tab="storm"><i>≋</i>Storm &amp; trees</button>
    <button data-tab="hazards"><i>⚠</i>Tree hazards</button>
    <button data-tab="routes"><i>⤳</i>Routes</button>
    <button data-tab="plan"><i>✚</i>Emergency plan</button>
    <button data-tab="dispatch"><i>✈</i>Drone dispatch</button>
    <button data-tab="infra"><i>⌗</i>Infrastructure</button>
    <button data-tab="three"><i>◭</i>3D point cloud</button>
    <button data-tab="quality"><i>✓</i>Data quality</button>
  </nav>

  <main>
    <section class="stage">
      <div class="mapwrap" id="mapwrap"><canvas id="map"></canvas></div>
      <div class="mapwrap hidden" id="glwrap"><canvas id="gl"></canvas>
        <div class="gl-help">drag: rotate · shift/right-drag: pan · wheel: zoom</div></div>
      <div class="dimsw" id="dimsw">
        <div class="seg"><button data-dim="2d" class="on" title="2D map">2D</button><button data-dim="3d" title="3D view of the scan">3D</button></div>
        <div class="m3 hidden" id="dimmodes"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="tip hidden" id="tip"></div>
      <div class="hint hidden" id="hint"></div>
      <div class="busy hidden" id="busy"><span></span> computing…</div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>

  <div class="dropall hidden" id="dropall"><div>⇪<br>Drop your 3D scan here<br><small>.las .laz .ply .obj .glb .xyz .txt .csv .pts .e57 · photos .jpg .png .tif</small></div></div>
  <script src="finland.js"></script>
  <script src="map.js"></script>
  <script src="viewer3d.js"></script>
  <script src="app.js"></script>
  <script src="infra.js"></script>
  <script src="hazard.js"></script>
  <script src="upload.js"></script>
</body>
</html>
